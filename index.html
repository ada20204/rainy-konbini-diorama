<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雨夜便利店街角 · 微缩景观</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0f1e'/%3E%3Crect x='10' y='24' width='44' height='28' rx='4' fill='%231e293b' stroke='%2338bdf8' stroke-width='2.5'/%3E%3Crect x='10' y='16' width='44' height='10' rx='3' fill='%23f59e0b'/%3E%3Crect x='16' y='32' width='18' height='14' rx='2' fill='%23fde68a'/%3E%3Crect x='38' y='32' width='10' height='20' rx='2' fill='%2338bdf8' fill-opacity='0.65'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0f1e;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      /* 纯视觉暗角，非 UI 元素 */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(0, 0, 0, 0) 52%,
          rgba(4, 8, 18, 0.22) 82%,
          rgba(3, 6, 14, 0.5) 100%
        );
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <script>
      // 仅失败时显示诊断信息（正常运行无任何 UI）
      window.addEventListener(
        'error',
        function (e) {
          if (document.getElementById('boot-error')) return;
          var d = document.createElement('div');
          d.id = 'boot-error';
          d.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:12px;padding:10px 14px;background:#7f1d1d;' +
            'color:#fff;font:13px/1.6 ui-monospace,monospace;border-radius:8px;z-index:99';
          d.textContent =
            '场景加载失败 → ' +
            (e.message || e.type) +
            (e.filename ? '（' + e.filename.split('/').pop() + '）' : '') +
            '。请确认浏览器支持 WebGL2 并已开启硬件加速。';
          document.body.appendChild(d);
        },
        true
      );
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
